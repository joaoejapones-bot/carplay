<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>CarPlay Map</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="icons/ios/180.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icons/ios/152.png">
    <link rel="apple-touch-icon" sizes="144x144" href="icons/ios/144.png">
    <link rel="apple-touch-icon" sizes="120x120" href="icons/ios/120.png">
    <link rel="apple-touch-icon" sizes="114x114" href="icons/ios/114.png">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="icons/android/launchericon-192x192.png">
    <link rel="icon" type="image/png" sizes="96x96" href="icons/android/launchericon-96x96.png">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Leaflet.ROTATE CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-rotate@0.6.3/leaflet.rotate.css"/>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Main Container -->
    <div class="app-container">
        <!-- Map Area -->
        <div id="map"></div>
        
        <!-- Speed HUD -->
        <div id="speed-hud" class="speed-hud">
            <span id="speed-value">0</span>
            <span class="speed-unit">km/h</span>
        </div>
        
        <!-- Volume Indicator -->
        <div id="volume-indicator" class="volume-indicator" style="display: none;">
            <span id="volume-value">50%</span>
        </div>
        
        <!-- Dark Mode Toggle -->
        <button id="dark-mode-btn" class="dark-mode-btn" aria-label="Modo escuro">
            <svg id="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <svg id="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                <circle cx="12" cy="12" r="5"/>
                <path d="M12 1V3M12 21V23M4.22 4.22L5.64 5.64M18.36 18.36L19.78 19.78M1 12H3M21 12H23M4.22 19.78L5.64 18.36M18.36 5.64L19.78 4.22"/>
            </svg>
        </button>
        
        <!-- Music Player Toggle -->
        <button id="music-btn" class="music-btn" aria-label="Player de música">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18V5l12-2v13"/>
                <circle cx="6" cy="18" r="3"/>
                <circle cx="18" cy="16" r="3"/>
            </svg>
        </button>
        
        <!-- Zoom Controls -->
        <div class="zoom-controls">
            <button id="zoom-in" class="zoom-btn" aria-label="Zoom in">+</button>
            <button id="zoom-out" class="zoom-btn" aria-label="Zoom out">−</button>
        </div>
        
        <!-- Follow Mode Button -->
        <button id="follow-btn" class="follow-btn" aria-label="Centralizar no veículo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/>
                <circle cx="7" cy="17" r="2"/>
                <circle cx="17" cy="17" r="2"/>
            </svg>
        </button>
        
        <!-- Bottom Control Bar -->
        <div class="control-bar">
            <button class="control-btn" id="btn-vol-down" aria-label="Diminuir volume">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 5L6 9H2V15H6L11 19V5Z"/>
                    <path d="M15.54 8.46C16.4774 9.39764 17.004 10.6692 17.004 12C17.004 13.3308 16.4774 14.6024 15.54 15.54"/>
                </svg>
            </button>
            <button class="control-btn" id="btn-prev" aria-label="Música anterior">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M6 6L6 18L16 12L6 6Z"/>
                    <rect x="16" y="6" width="2" height="12"/>
                </svg>
            </button>
            <button class="control-btn control-btn-play" id="btn-play" aria-label="Play/Pause">
                <svg id="icon-play" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5V19L19 12L8 5Z"/>
                </svg>
                <svg id="icon-pause" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                    <path d="M6 4H10V20H6V4ZM14 4H18V20H14V4Z"/>
                </svg>
            </button>
            <button class="control-btn" id="btn-next" aria-label="Próxima música">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M6 6L6 18L16 12L6 6Z"/>
                    <rect x="16" y="6" width="2" height="12"/>
                </svg>
            </button>
            <button class="control-btn" id="btn-vol-up" aria-label="Aumentar volume">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 5L6 9H2V15H6L11 19V5Z"/>
                    <path d="M15.54 8.46C16.4774 9.39764 17.004 10.6692 17.004 12C17.004 13.3308 16.4774 14.6024 15.54 15.54"/>
                    <path d="M19.07 4.93C20.9447 6.80553 21.9969 9.34836 21.9969 12C21.9969 14.6516 20.9447 17.1945 19.07 19.07"/>
                </svg>
            </button>
            <button class="control-btn" id="btn-import" aria-label="Importar mídia">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/>
                </svg>
            </button>
        </div>
        
        <!-- Hidden File Input -->
        <input type="file" id="file-input" multiple accept="audio/*,video/mp4" style="display: none;">
    </div>
    
    <!-- Music Player Modal -->
    <div id="music-modal" class="music-modal" style="display: none;">
        <div class="music-modal-content">
            <div class="music-modal-header">
                <h2>Player de Música</h2>
                <button id="close-modal" class="close-modal" aria-label="Fechar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            
            <!-- Faixa Atual -->
            <div class="now-playing">
                <div class="now-playing-icon">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M9 18V5l12-2v13"/>
                        <circle cx="6" cy="18" r="3"/>
                        <circle cx="18" cy="16" r="3"/>
                    </svg>
                </div>
                <div class="now-playing-info">
                    <h3 id="modal-track-name">Nenhuma faixa</h3>
                    <p id="modal-track-counter">0/0</p>
                </div>
            </div>
            
            <!-- Controles do Player no Modal -->
            <div class="modal-controls">
                <button class="modal-control-btn" id="modal-btn-prev">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 6L6 18L16 12L6 6Z"/>
                        <rect x="16" y="6" width="2" height="12"/>
                    </svg>
                </button>
                <button class="modal-control-btn modal-control-btn-play" id="modal-btn-play">
                    <svg id="modal-icon-play" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5V19L19 12L8 5Z"/>
                    </svg>
                    <svg id="modal-icon-pause" width="32" height="32" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                        <path d="M6 4H10V20H6V4ZM14 4H18V20H14V4Z"/>
                    </svg>
                </button>
                <button class="modal-control-btn" id="modal-btn-next">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 6L6 18L16 12L6 6Z"/>
                        <rect x="16" y="6" width="2" height="12"/>
                    </svg>
                </button>
            </div>
            
            <!-- Playlist -->
            <div class="playlist-container">
                <h3>Playlist</h3>
                <div id="playlist-list" class="playlist-list">
                    <p class="empty-playlist">Nenhuma faixa carregada</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Leaflet.ROTATE JS -->
    <script src="https://unpkg.com/leaflet-rotate@0.6.3/leaflet.rotate.js"></script>
    
    <!-- Player Logic -->
    <script src="player.js"></script>
    
    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
